<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Guía Turístico</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rojo:     #D72638;
      --azul:     #1565C0;
      --amarillo: #F5A623;
      --negro:    #000000;
      --blanco:   #FFFFFF;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--negro);
      color: var(--blanco);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* ── PANTALLA DE SELECCIÓN ── */
    #selector {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 0;
      transition: opacity 0.5s ease;
    }

    .titulo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(28px, 5vw, 56px);
      letter-spacing: 0.12em;
      text-align: center;
      color: var(--blanco);
      margin-bottom: 12px;
      opacity: 0.92;
    }

    .subtitulo {
      font-size: clamp(12px, 2vw, 16px);
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 56px;
      text-align: center;
    }

    .botones {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 20px;
    }

    .btn {
      position: relative;
      width: clamp(140px, 22vw, 220px);
      height: clamp(140px, 22vw, 220px);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(18px, 3vw, 28px);
      letter-spacing: 0.1em;
      color: var(--blanco);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid transparent;
      transition: border-color 0.18s ease;
    }

    .btn:hover  { transform: scale(1.07); }
    .btn:active { transform: scale(0.96); }

    .btn-es {
      background: var(--rojo);
      box-shadow: 0 0 40px rgba(215, 38, 56, 0.35);
    }
    .btn-es:hover  { box-shadow: 0 0 60px rgba(215, 38, 56, 0.65); }
    .btn-es::after { border-color: rgba(215,38,56,0.4); }

    .btn-en {
      background: var(--azul);
      box-shadow: 0 0 40px rgba(21, 101, 192, 0.35);
    }
    .btn-en:hover  { box-shadow: 0 0 60px rgba(21, 101, 192, 0.65); }
    .btn-en::after { border-color: rgba(21,101,192,0.4); }

    .btn-zh {
      background: var(--amarillo);
      box-shadow: 0 0 40px rgba(245, 166, 35, 0.35);
      color: #1a1a1a;
    }
    .btn-zh:hover  { box-shadow: 0 0 60px rgba(245, 166, 35, 0.65); }
    .btn-zh::after { border-color: rgba(245,166,35,0.4); }

    .bandera {
      display: block;
      font-size: clamp(28px, 5vw, 44px);
      margin-bottom: 6px;
    }

    /* ── PANTALLA DE VIDEO ── */
    #reproductor {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--negro);
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #reproductor.activo {
      display: flex;
    }

    .video-wrap {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16/9;
      background: #111;
    }

    .video-wrap iframe {
      width: 100%; height: 100%;
      border: none;
    }

    .btn-volver {
      margin-top: 24px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      color: rgba(255,255,255,0.6);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 10px 28px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-volver:hover {
      border-color: rgba(255,255,255,0.7);
      color: var(--blanco);
    }

    /* ── IDs de YouTube — CAMBIA ESTOS ── */
    /*
      Reemplaza XXXXXXXXXX por el ID real de cada video.
      El ID es la parte después de ?v= en la URL de YouTube.
      Ejemplo: https://youtu.be/dQw4w9WgXcQ → el ID es dQw4w9WgXcQ
    */
  </style>
</head>
<body>

<!-- SELECTOR DE IDIOMA -->
<div id="selector">
  <p class="titulo">Elige tu idioma</p>
  <p class="subtitulo">Select your language &nbsp;/&nbsp; 选择语言</p>

  <div class="botones">
    <button class="btn btn-es" onclick="reproducir('zNkKVjuCc10')">
      <span class="bandera">🇵🇦</span>
      Español
    </button>

    <button class="btn btn-en" onclick="reproducir('HHJn9tyhKHs')">
      <span class="bandera">🇬🇧</span>
      English
    </button>

    <button class="btn btn-zh" onclick="reproducir('Yt8pSKZHc9A')">
      <span class="bandera">🇨🇳</span>
      中文
    </button>
  </div>
</div>

<!-- REPRODUCTOR -->
<div id="reproductor">
  <div class="video-wrap">
    <iframe
      id="iframe-yt"
      src=""
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>
  <button class="btn-volver" onclick="volver()">← Volver / Back / 返回</button>
</div>

<script>
  function reproducir(videoId) {
    // Oculta selector
    document.getElementById('selector').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('selector').style.display = 'none';

      // Carga el video con autoplay
      document.getElementById('iframe-yt').src =
        'https://www.youtube.com/embed/' + videoId + '?autoplay=1&rel=0&modestbranding=1';

      document.getElementById('reproductor').classList.add('activo');
    }, 400);
  }

  function volver() {
    // Detiene el video
    document.getElementById('iframe-yt').src = '';
    document.getElementById('reproductor').classList.remove('activo');

    // Muestra selector de nuevo
    const sel = document.getElementById('selector');
    sel.style.display = 'flex';
    setTimeout(() => sel.style.opacity = '1', 10);
  }
</script>

</body>
</html>
